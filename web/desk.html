<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کارتابل من | کارنامه</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/desk.css"><script src="/permissions.js" defer></script><script src="/desk.js" defer></script></head><body><header><img src="/logo.png" alt="کارنامه"><strong>کارتابل من</strong><a data-permission="company.view" href="/">فضای شرکت</a><a data-permission="workspace.view" href="/workspace">کارها و پیگیری</a><a data-permission="attendance.view" href="/attendance">تردد</a><a data-permission="chat.view" href="/chat">چت</a><button id="logout" hidden>خروج</button></header><main><section id="login" class="card narrow"><h1>ورود به کارتابل</h1><form id="loginForm"><label>نام کاربری<input id="username" autocomplete="username" dir="ltr" required></label><label>رمز عبور<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">ورود</button></form></section><section id="desk" hidden><h1 id="name"></h1><nav class="toolbar"><button id="myTab">درخواست‌های من</button><button id="notesTab">یادداشت‌های من</button><button data-permission="desk.approve" id="reviewTab" hidden>بررسی مدیر</button><button id="refresh">بروزرسانی</button></nav><section id="leaves"><button class="primary" data-permission="desk.create" id="newLeave">درخواست مرخصی</button><div id="leaveItems" class="desk-list"></div></section><section id="notes" hidden><div class="toolbar"><button class="primary" data-permission="desk.create" id="newNote">یادداشت تازه</button><input id="noteSearch" type="search" placeholder="جستجو در یادداشت‌های من"></div><div id="noteItems" class="desk-list"></div></section><section id="reviews" hidden><label class="row-check"><input id="pending" type="checkbox" checked>فقط منتظر بررسی</label><div id="reviewItems" class="desk-list"></div></section></section><p id="status" role="status"></p></main><dialog id="dialog"><form id="form"><h2 id="dialogTitle"></h2><div id="fields"></div><p id="dialogError" role="alert"></p><div class="toolbar"><button id="save" class="primary">ثبت</button><button id="cancel" type="button">بستن</button></div></form></dialog><section id="toasts" aria-live="polite"></section><section id="permissionDenied" hidden><h1>دسترسی به این بخش فعال نیست</h1><p>مدیر شرکت می‌تواند مجوز این بخش را بررسی کند.</p><a data-permission="desk.view" href="/desk">کارتابل من</a> · <a data-permission="workspace.view" href="/workspace">کارها و پیگیری</a> · <a data-permission="attendance.view" href="/attendance">تردد</a><a data-permission="chat.view" href="/chat">چت</a><button type="button" id="deniedLogout">خروج از حساب</button></section></body></html>
