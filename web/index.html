<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>کارنامه | فضای شرکت</title><link rel="stylesheet" href="/style.css"><script src="/permissions.js" defer></script><script src="/app.js" defer></script></head><body><a data-permission="workspace.view" href="/workspace" class="chatLink">امروز و پیگیری</a><a data-permission="desk.view" href="/desk" class="chatLink">کارتابل من</a><a data-permission="attendance.view" href="/attendance" class="chatLink">تردد</a><a data-permission="chat.view" href="/chat" class="chatLink">گفتگوی شرکت</a>
<header><img src="/logo.png" alt="کارنامه"><strong>فضای شرکت</strong><span id="connection">آماده اتصال</span><button id="logout" hidden title="خروج از حساب" aria-label="خروج از حساب">↪</button></header>
<main><section id="login" class="card narrow"><h1>ورود به کارنامه</h1><p>حساب شما را مدیر شرکت می‌سازد.</p><form id="loginForm"><label>نام کاربری<input id="username" autocomplete="username" required></label><label>رمز عبور<input id="password" type="password" autocomplete="current-password" required></label><button type="submit" class="primary">ورود</button></form></section>
<section id="workspace" hidden><div class="toolbar"><label>شرکت<select id="company" aria-label="شرکت"></select></label><label>بخش<select id="kind" aria-label="بخش"></select></label><input id="search" type="search" placeholder="جستجو در پرونده‌ها و اسناد خوانده‌شده"><button id="refresh" title="تازه‌سازی" aria-label="تازه‌سازی">↻</button><button data-permission="company.create" id="add" title="افزودن" aria-label="افزودن">＋</button><button data-permission="company.create" id="notice" title="اطلاعیه تازه" aria-label="اطلاعیه تازه">♧</button><button data-permission="access.manage" id="accounts" title="حساب‌های کاربران" aria-label="حساب‌های کاربران">♙</button><button data-permission="company.export" id="export" title="خروجی فایل" aria-label="خروجی فایل">⇩</button></div>
<div id="summary" class="summary"></div><div id="inbox" class="card"></div><div id="items" class="grid"></div><div class="toolbar"><button id="prev">صفحه قبل</button><span id="count"></span><button id="next">صفحه بعد</button></div></section>
<p id="status" role="status" aria-live="polite"></p></main>
<dialog id="dialog"><form id="editForm"><div class="dialogTitle"><h2 id="dialogTitle"></h2><button id="cancel" type="button" title="بستن" aria-label="بستن">×</button></div><div id="fields"></div><div id="details"></div><p id="dialogError" role="alert"></p><div class="toolbar"><button type="submit" id="save" class="primary" title="ذخیره" aria-label="ذخیره">✓</button><button type="button" id="archive" class="danger" title="بایگانی" aria-label="بایگانی">⌫</button></div></form></dialog>
<section id="permissionDenied" hidden><h1>دسترسی به این بخش فعال نیست</h1><p>مدیر شرکت می‌تواند مجوز این بخش را بررسی کند.</p><a data-permission="desk.view" href="/desk">کارتابل من</a> · <a data-permission="workspace.view" href="/workspace">کارها و پیگیری</a> · <a data-permission="attendance.view" href="/attendance">تردد</a><a data-permission="chat.view" href="/chat">چت</a><button type="button" id="deniedLogout">خروج از حساب</button></section></body></html>
