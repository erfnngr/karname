<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>امروز و پیگیری | کارنامه</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/workspace.css"><script src="/permissions.js" defer></script><script src="/workspace.js" defer></script></head><body><header><img src="/logo.png" alt="کارنامه"><strong>امروز و پیگیری</strong><a data-permission="company.view" href="/">پرونده‌های شرکت</a><a data-permission="desk.view" href="/desk">کارتابل من</a><a data-permission="attendance.view" href="/attendance">تردد</a><a data-permission="chat.view" href="/chat">چت</a><button id="logout" hidden>خروج</button></header><main><section id="login" class="card narrow"><h1>ورود به کارنامه</h1><form id="loginForm"><label>نام کاربری<input id="username" autocomplete="username" required dir="ltr"></label><label>رمز عبور<input id="password" type="password" autocomplete="current-password" required></label><button>ورود</button></form></section><section id="app" hidden><h1 id="name"></h1><div class="toolbar"><select id="company" aria-label="شرکت"><option value="">همه شرکت‌ها</option></select><input id="search" type="search" placeholder="عنوان کار"><select id="view" aria-label="نما"><option value="all">همه کارها</option><option value="mine">کارهای من</option><option value="today">امروز</option><option value="overdue">معوق</option><option value="review">منتظر تأیید من</option><option value="saved">علاقه‌مندی</option></select><button id="saveView">ذخیره نما</button><button id="deleteView">حذف نما</button><button id="refresh">بروزرسانی</button></div><nav class="toolbar"><button data-page="tasks">کارها</button><button data-page="board">نمای ستونی</button><button data-page="requests">درخواست‌ها</button><button data-page="team">کارکنان</button><button data-page="trash">سطل بازیافت</button></nav><div id="summary" class="summary"></div><section id="notifications" class="notice-list" aria-label="اعلان‌های من"></section><section id="tasks" class="grid"></section><section id="board" class="board" hidden></section><section id="requests" hidden><button data-permission="desk.create" id="newRequest">درخواست اداری تازه</button><div id="requestItems" class="grid"></div></section><section id="team" hidden><div class="toolbar"><input id="month" placeholder="ماه شمسی 1405/08" aria-label="ماه شمسی"><button data-permission="attendance.view" id="balance">مانده مرخصی من</button><button data-permission="attendance.manage_schedule" id="workload">ظرفیت کارکنان</button><button data-permission="attendance.view" id="attendance">بررسی تردد</button></div><div id="teamItems"></div></section><section id="trash" class="grid" hidden></section></section><p id="status" role="status"></p></main><aside id="drawer" hidden><button id="closeDrawer">بستن جزئیات</button><h2 id="drawerTitle"></h2><div id="drawerBody"></div></aside><dialog id="dialog"><form id="form"><h2 id="dialogTitle"></h2><div id="fields"></div><p id="dialogError" role="alert"></p><div class="toolbar"><button id="save">ثبت</button><button id="cancel" type="button">بستن</button></div></form></dialog><section id="permissionDenied" hidden><h1>دسترسی به این بخش فعال نیست</h1><p>مدیر شرکت می‌تواند مجوز این بخش را بررسی کند.</p><a data-permission="desk.view" href="/desk">کارتابل من</a> · <a data-permission="workspace.view" href="/workspace">کارها و پیگیری</a> · <a data-permission="attendance.view" href="/attendance">تردد</a><a data-permission="chat.view" href="/chat">چت</a><button type="button" id="deniedLogout">خروج از حساب</button></section></body></html>
