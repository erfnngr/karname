<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گفتگو | کارنامه</title><link rel="stylesheet" href="/chat.css"><script src="/permissions.js" defer></script><script src="/delivery.js" defer></script><script src="/chat.js" defer></script></head><body><section id="login" class="login"><img src="/logo.png" alt="کارنامه"><h1>گفتگوی شرکت</h1><form id="loginForm"><label>نام کاربری<input id="username" autocomplete="username" dir="ltr" required></label><label>رمز عبور<input id="password" type="password" autocomplete="current-password" required></label><button>ورود</button></form><p id="loginError" role="alert"></p></section><main id="app" hidden><aside><header><h2>کارنامه</h2><a data-permission="attendance.view" href="/attendance">تردد</a><a data-permission="workspace.view" href="/workspace">کارها و پیگیری</a><a data-permission="desk.view" href="/desk">کارتابل من</a><a data-permission="company.view" href="/">فضای شرکت</a></header><div id="me"></div><button data-permission="chat.direct" data-permission-global="true" id="newDirect">گفتگوی شخصی تازه</button><nav id="rooms"></nav><footer><button id="profile">عکس و رنگ من</button><button id="logout">خروج</button></footer></aside><section class="conversation"><header><div><h2 id="roomTitle">گفتگوها</h2><small id="members"></small></div><label class="mute"><input id="mute" type="checkbox">بی‌صدا</label></header><div class="tools"><input id="messageSearch" type="search" placeholder="جستجوی پیام / پیوست"><select id="messageFilter"><option value="">همه پیام‌ها</option><option value="saved">ذخیره‌شده</option><option value="pinned">سنجاق‌شده</option></select><button id="closeThread" hidden>بازگشت به گروه</button><button data-permission="chat.send" data-permission-global="true" id="outbox">صف ارسال</button></div><p id="status" role="status"></p><section id="messages" aria-label="پیام‌های گروه"></section><form data-permission="chat.send" id="composeForm"><p id="replyInfo"></p><button type="button" id="cancelReply" hidden>لغو پاسخ</button><p id="fileNames"></p><div class="composer"><textarea id="compose" placeholder="پیام بنویسید…" rows="2" maxlength="8000"></textarea><button id="send">ارسال</button></div><div class="tools"><button type="button" data-permission="chat.attach" id="attach" title="پیوست">📎</button><input id="file" type="file" accept=".png,.jpg,.jpeg,.pdf,.xlsx,.xls,.csv,.txt,.docx,.zip" multiple hidden><button type="button" id="mention">@ اشاره</button><button id="emoji" type="button" title="اموجی">☺</button><button data-permission="chat.meeting" id="poll" type="button">نظرسنجی</button><button data-permission="chat.meeting" id="meeting" type="button">جلسه</button><button id="notifications" type="button">اعلان مرورگر</button><button id="clearFiles" type="button" hidden>پاک کردن پیوست‌ها</button></div></form></section></main><div id="toasts" aria-live="polite"></div><dialog id="dialog"><form id="dialogForm"><h2 id="dialogTitle"></h2><div id="fields"></div><p id="dialogError" role="alert"></p><div class="tools"><button id="save">ثبت</button><button id="cancel" type="button">بستن</button></div></form></dialog><section id="permissionDenied" hidden><h1>دسترسی به این بخش فعال نیست</h1><p>مدیر شرکت می‌تواند مجوز این بخش را بررسی کند.</p><a data-permission="desk.view" href="/desk">کارتابل من</a> · <a data-permission="attendance.view" href="/attendance">تردد</a><a data-permission="workspace.view" href="/workspace">کارها و پیگیری</a> · <a data-permission="chat.view" href="/chat">چت</a><button type="button" id="deniedLogout">خروج از حساب</button></section></body></html>
